name: Verify Qwen3.8 Minis API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-qwen38-minis-api.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify H200 tool compatibility
        run: |
          set +e
          BASE='https://g9hnto0u7lvbu837.us-east-2.aws.endpoints.huggingface.cloud/v1/chat/completions'
          TOOL='{"type":"function","function":{"name":"get_time","description":"Get current time","parameters":{"type":"object","properties":{},"additionalProperties":false}}}'
          probe() {
            label="$1"
            payload="$2"
            echo "===== $label ====="
            code=$(curl -sS --max-time 30 -o "/tmp/$label.out" -w '%{http_code}' "$BASE" -H 'Content-Type: application/json' -d "$payload")
            echo "http=$code"
            head -c 2500 "/tmp/$label.out"
            echo
          }
          probe no_tools '{"model":"Qwen/Qwen3.8-27B","messages":[{"role":"user","content":"Reply exactly OK"}],"max_tokens":32,"stream":false,"chat_template_kwargs":{"enable_thinking":false}}'
          probe with_tools "{\"model\":\"Qwen/Qwen3.8-27B\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply exactly OK\"}],\"max_tokens\":32,\"stream\":false,\"chat_template_kwargs\":{\"enable_thinking\":false},\"tools\":[$TOOL]}"
          probe tools_none "{\"model\":\"Qwen/Qwen3.8-27B\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply exactly OK\"}],\"max_tokens\":32,\"stream\":false,\"chat_template_kwargs\":{\"enable_thinking\":false},\"tools\":[$TOOL],\"tool_choice\":\"none\"}"

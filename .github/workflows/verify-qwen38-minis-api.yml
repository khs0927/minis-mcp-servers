name: Verify Qwen3.8 Minis API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-qwen38-minis-api.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify H200 output token limits
        run: |
          set +e
          BASE='https://g9hnto0u7lvbu837.us-east-2.aws.endpoints.huggingface.cloud/v1/chat/completions'
          probe() {
            label="$1"
            payload="$2"
            echo "===== $label ====="
            code=$(curl -sS --max-time 25 -o "/tmp/$label.out" -w '%{http_code}' "$BASE" -H 'Content-Type: application/json' -d "$payload")
            echo "http=$code"
            head -c 2500 "/tmp/$label.out"
            echo
          }
          probe max_8192 '{"model":"Qwen/Qwen3.8-27B","messages":[{"role":"user","content":"Reply exactly OK"}],"max_tokens":8192,"stream":false,"chat_template_kwargs":{"enable_thinking":false}}'
          probe max_completion_8192 '{"model":"Qwen/Qwen3.8-27B","messages":[{"role":"user","content":"Reply exactly OK"}],"max_completion_tokens":8192,"stream":false,"chat_template_kwargs":{"enable_thinking":false}}'
          probe max_32768 '{"model":"Qwen/Qwen3.8-27B","messages":[{"role":"user","content":"Reply exactly OK"}],"max_tokens":32768,"stream":false,"chat_template_kwargs":{"enable_thinking":false}}'

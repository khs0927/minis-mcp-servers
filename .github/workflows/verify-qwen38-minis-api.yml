name: Verify Qwen3.8 Minis API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-qwen38-minis-api.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify gateway auth and health
        run: |
          set -euo pipefail
          API_ROOT='https://api-v2.appdeploy.ai/app/qwen3-8-free-gateway-n995yy/api'
          curl -sS --max-time 30 "$API_ROOT/health" -o /tmp/health.json
          jq '{version,freeOnly,apiAuth,activeProvider,failoverProvider,checks}' /tmp/health.json
          test "$(jq -r '.version' /tmp/health.json)" = '0.5.2'

      - name: Verify primary H200 no-thinking fast path
        run: |
          set -euo pipefail
          PRIMARY='https://g9hnto0u7lvbu837.us-east-2.aws.endpoints.huggingface.cloud/v1/chat/completions'
          curl -sS --max-time 40 -w '%{http_code} %{time_total} %{time_starttransfer}\n' "$PRIMARY" \
            -H 'Content-Type: application/json' \
            -d '{"model":"Qwen/Qwen3.8-27B","messages":[{"role":"user","content":"Reply exactly OK"}],"max_tokens":256,"stream":false,"chat_template_kwargs":{"enable_thinking":false}}' \
            -o /tmp/no-thinking.json > /tmp/timing.txt
          cat /tmp/timing.txt
          jq '{id,choices:[.choices[]? | {finish_reason,message:{content:.message.content,reasoning:.message.reasoning}}],usage}' /tmp/no-thinking.json
          test "$(cut -d' ' -f1 /tmp/timing.txt)" = '200'
          test -n "$(jq -r '.choices[0].message.content // empty' /tmp/no-thinking.json)"

      - name: Confirm ZeroGPU current state
        continue-on-error: true
        run: |
          set +e
          SPACE='https://yinhaoc-qwen3-8-27b-demo.hf.space'
          curl -sS --max-time 30 "$SPACE/gradio_api/call/v2/chat" -H 'Content-Type: application/json' -d '{"message":{"text":"Reply exactly OK","files":[]},"enable_thinking":false,"reasoning_effort":"low","max_tokens":512}' -o /tmp/submit.json
          cat /tmp/submit.json
          EVENT_ID=$(jq -r '.event_id // empty' /tmp/submit.json)
          if [ -n "$EVENT_ID" ]; then curl -sS -N --max-time 30 "$SPACE/gradio_api/call/chat/$EVENT_ID" || true; fi

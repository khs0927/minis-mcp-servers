name: Verify Qwen3.8 Minis API

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify public health and anonymous denial
        run: |
          set -euo pipefail
          API_ROOT='https://api-v2.appdeploy.ai/app/qwen3-8-free-gateway-n995yy/api'
          health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$API_ROOT/health")
          models_code=$(curl -sS -o /tmp/models.json -w '%{http_code}' --max-time 20 "$API_ROOT/v1/models")
          echo "health_http=$health_code"
          jq '{version,freeOnly,apiAuth,activeProvider,failoverProvider}' /tmp/health.json
          echo "anonymous_models_http=$models_code"
          jq '{error}' /tmp/models.json
          test "$health_code" = '200'
          test "$(jq -r '.version' /tmp/health.json)" = '0.5.1'
          test "$(jq -r '.apiAuth.required' /tmp/health.json)" = 'true'
          test "$models_code" = '401'
          test "$(jq -r '.error.code' /tmp/models.json)" = 'invalid_api_key'

name: Verify Qwen3.8 Minis API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-qwen38-minis-api.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect apathy exact-model Space server
        run: |
          set -euo pipefail
          APP='https://huggingface.co/spaces/apathy-exe/Qwen3.8-27B/resolve/main/app.py'
          curl -L -sS --max-time 30 "$APP" -o /tmp/app.py
          echo '--- imports and constants ---'
          sed -n '1,90p' /tmp/app.py
          echo '--- server routes ---'
          sed -n '90,180p' /tmp/app.py
          echo '--- remaining handlers ---'
          sed -n '180,320p' /tmp/app.py

      - name: Probe likely apathy routes
        continue-on-error: true
        run: |
          set +e
          BASE='https://apathy-exe-qwen3-8-27b.hf.space'
          for path in / /health /v1/models /models /docs /openapi.json /gradio_api/info; do
            echo "--- GET $path ---"
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$BASE$path")
            echo "http=$code"
            head -c 2000 /tmp/body || true
            echo
          done

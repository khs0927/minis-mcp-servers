name: Verify Qwen3.8 Minis API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-qwen38-minis-api.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify gateway auth and health
        run: |
          set -euo pipefail
          API_ROOT='https://api-v2.appdeploy.ai/app/qwen3-8-free-gateway-n995yy/api'
          health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "$API_ROOT/health")
          models_code=$(curl -sS -o /tmp/models.json -w '%{http_code}' --max-time 30 "$API_ROOT/v1/models")
          echo "health_http=$health_code"
          jq '{version,freeOnly,apiAuth,activeProvider,failoverProvider,checks}' /tmp/health.json
          echo "anonymous_models_http=$models_code"
          jq '{error}' /tmp/models.json
          test "$health_code" = '200'
          test "$(jq -r '.version' /tmp/health.json)" = '0.5.2'
          test "$(jq -r '.apiAuth.required' /tmp/health.json)" = 'true'
          test "$models_code" = '401'

      - name: Compare primary H200 chat payloads
        continue-on-error: true
        run: |
          set +e
          PRIMARY='https://g9hnto0u7lvbu837.us-east-2.aws.endpoints.huggingface.cloud/v1/chat/completions'
          probe() {
            label="$1"
            payload="$2"
            echo "--- $label ---"
            curl -sS --max-time 70 -w '\nhttp=%{http_code} total=%{time_total} starttransfer=%{time_starttransfer}\n' "$PRIMARY" -H 'Content-Type: application/json' -d "$payload" -o "/tmp/$label.json"
            code=$?
            jq '{id,choices:[.choices[]? | {finish_reason,message:{content:.message.content,reasoning:.message.reasoning}}],usage}' "/tmp/$label.json" || cat "/tmp/$label.json"
            echo "curl_exit=$code"
          }
          probe tiny16 '{"model":"Qwen/Qwen3.8-27B","messages":[{"role":"user","content":"Reply exactly OK"}],"max_tokens":16,"stream":false}'
          probe low256 '{"model":"Qwen/Qwen3.8-27B","messages":[{"role":"user","content":"Reply exactly OK"}],"max_tokens":256,"reasoning_effort":"low","stream":false}'
          probe plain512 '{"model":"Qwen/Qwen3.8-27B","messages":[{"role":"user","content":"Reply exactly OK"}],"max_tokens":512,"stream":false}'
          probe low512 '{"model":"Qwen/Qwen3.8-27B","messages":[{"role":"user","content":"Reply exactly OK"}],"max_tokens":512,"reasoning_effort":"low","stream":false}'

      - name: Probe ZeroGPU directly
        continue-on-error: true
        run: |
          set +e
          SPACE='https://yinhaoc-qwen3-8-27b-demo.hf.space'
          curl -sS --max-time 30 "$SPACE/gradio_api/info" -o /tmp/info.json
          echo "visibility=$(jq -r '.named_endpoints["/chat"].api_visibility // "missing"' /tmp/info.json)"
          curl -sS --max-time 30 "$SPACE/gradio_api/call/v2/chat" -H 'Content-Type: application/json' -d '{"message":{"text":"Reply exactly OK","files":[]},"enable_thinking":false,"reasoning_effort":"low","max_tokens":512}' -o /tmp/submit.json
          cat /tmp/submit.json
          EVENT_ID=$(jq -r '.event_id // empty' /tmp/submit.json)
          if [ -n "$EVENT_ID" ]; then curl -sS -N --max-time 45 "$SPACE/gradio_api/call/chat/$EVENT_ID" || true; fi

      - name: Probe deployed gateway
        continue-on-error: true
        run: |
          set +e
          API_ROOT='https://api-v2.appdeploy.ai/app/qwen3-8-free-gateway-n995yy/api'
          curl -sS --max-time 70 -w '\nhttp=%{http_code} total=%{time_total}\n' "$API_ROOT/provider-probe" -o /tmp/probe.json
          jq . /tmp/probe.json || cat /tmp/probe.json

name: Grok Minis read-only preflight
on:
  pull_request:
    paths:
      - "integrations/grok-minis/**"
      - ".github/workflows/grok-minis-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JS syntax
        run: |
          node --check integrations/grok-minis/probe.mjs
          node --check integrations/grok-minis/probe.test.mjs
      - name: Read-only unit tests (mock transport)
        run: node --test integrations/grok-minis/probe.test.mjs

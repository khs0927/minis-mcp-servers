name: Probe Qwen3.8 Free Backups

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/probe-qwen38-backups.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Extract independent H200 endpoints
        run: |
          set -euo pipefail
          for BASE in 'https://nodelinker-qwen-3-8-27b-h200.hf.space' 'https://victor-qwen3-8-27b-free-endpoint.hf.space'; do
            echo "=== $BASE ==="
            curl -fsSL --max-time 20 "$BASE/" -o /tmp/page.html
            grep -Eo 'https://[^"<>[:space:]]+' /tmp/page.html | sed 's/[),;]$//' | sort -u | grep -E 'endpoints\.huggingface\.cloud|/v1|qwen|Qwen' || true
            grep -Eo 'https://[A-Za-z0-9._-]+\.aws\.endpoints\.huggingface\.cloud(/v1)?' /tmp/page.html | sort -u || true
          done

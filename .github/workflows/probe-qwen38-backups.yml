name: Probe Qwen3.8 Free Backups

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/probe-qwen38-backups.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect strongest Qwen3.8 backup candidates
        run: |
          set -euo pipefail
          for ID in 'akhaliq/Qwen3.8-27B' 'Yinhaoc/qwen3.8-27b-demo' 'apathy-exe/Qwen3.8-27B' 'apathy-exe/Qwen3.8-27B-2' 'Daankular/Qwen3.8-27B' 'NodeLinker/Qwen-3.8-27B-H200'; do
            echo "=== $ID ==="
            META=$(curl -fsS --max-time 20 "https://huggingface.co/api/spaces/$ID")
            SUB=$(printf '%s' "$META" | jq -r '.subdomain')
            BASE="https://$SUB.hf.space"
            printf '%s' "$META" | jq '{id,sdk,runtime,models,tags}'
            echo "BASE=$BASE"
            if curl -fsS --max-time 15 "$BASE/gradio_api/info" -o /tmp/info.json; then
              jq '{named_endpoints: (.named_endpoints | with_entries(.value |= {api_visibility, description, parameters: [.parameters[]? | {parameter_name, parameter_default, parameter_has_default, type}]}))}' /tmp/info.json
            else
              echo 'NO_GRADIO_INFO'
            fi
            echo 'ROOT_URLS:'
            curl -fsSL --max-time 15 "$BASE/" 2>/dev/null | grep -Eo 'https://[^"<> ]+' | head -20 || true
            echo
          done

name: Probe Qwen3.8 Free Backups

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/probe-qwen38-backups.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Execute exact-model ZeroGPU candidate and inspect second candidate
        run: |
          set -euo pipefail
          YBASE='https://yinhaoc-qwen3-8-27b-demo.hf.space'
          echo '=== Yinhaoc exact Qwen3.8 live inference ==='
          SUBMIT=$(curl -fsS --max-time 30 -X POST "$YBASE/gradio_api/call/v2/chat" -H 'Content-Type: application/json' -d '{"message":{"text":"Reply exactly OK","files":[]},"enable_thinking":false,"reasoning_effort":"low","max_tokens":512}')
          echo "$SUBMIT"
          EVENT_ID=$(printf '%s' "$SUBMIT" | jq -r '.event_id')
          test -n "$EVENT_ID" && test "$EVENT_ID" != 'null'
          curl -fsS -N --max-time 150 "$YBASE/gradio_api/call/chat/$EVENT_ID" | tee /tmp/yinhaoc.sse
          echo
          echo '=== akhaliq endpoint schema ==='
          curl -fsS --max-time 20 'https://akhaliq-qwen3-8-27b.hf.space/gradio_api/info' | jq '.named_endpoints["/answer"] | {api_visibility,description,parameters:[.parameters[]|{label,parameter_name,parameter_default,parameter_has_default,example_input,type}],code_snippets}'

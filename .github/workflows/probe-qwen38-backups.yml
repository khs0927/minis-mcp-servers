name: Probe Qwen3.8 Free Backups

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/probe-qwen38-backups.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Search and probe public Qwen3.8 Spaces
        run: |
          set -euo pipefail
          echo '--- HF Space search ---'
          curl -fsS --max-time 30 'https://huggingface.co/api/spaces?search=Qwen3.8-27B&limit=50&full=true' -o /tmp/spaces.json
          jq -r '.[] | [.id, (.runtime.stage // ""), (.runtime.hardware.current // ""), (.sdk // ""), ((.tags // [])|join(","))] | @tsv' /tmp/spaces.json
          echo
          echo '--- candidate OpenAPI probes ---'
          jq -r '.[].id' /tmp/spaces.json | while read -r ID; do
            META=$(curl -fsS --max-time 15 "https://huggingface.co/api/spaces/$ID" || true)
            SUB=$(printf '%s' "$META" | jq -r '.subdomain // empty' 2>/dev/null || true)
            STAGE=$(printf '%s' "$META" | jq -r '.runtime.stage // empty' 2>/dev/null || true)
            [ -n "$SUB" ] || continue
            BASE="https://$SUB.hf.space"
            CODE=$(curl -sS -o /tmp/openapi.json -w '%{http_code}' --max-time 10 "$BASE/gradio_api/openapi.json" || true)
            PATHS=$(jq -r '[.paths|keys[]? | select(test("/call/"))] | join(",")' /tmp/openapi.json 2>/dev/null || true)
            printf '%s\t%s\t%s\t%s\t%s\n' "$ID" "$STAGE" "$BASE" "$CODE" "$PATHS"
          done

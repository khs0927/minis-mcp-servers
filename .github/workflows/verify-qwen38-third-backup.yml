name: Verify Third Qwen3.8 Backup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-qwen38-third-backup.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Test akhaliq exact-model public Gradio endpoint without token
        run: |
          set -euo pipefail
          BASE='https://akhaliq-qwen3-8-27b.hf.space'
          INFO=$(curl -fsS --max-time 20 "$BASE/gradio_api/info")
          echo "$INFO" | jq '.named_endpoints["/answer"] | {api_visibility, parameters: [.parameters[] | {parameter_name,label}]}'
          SUBMIT=$(curl -sS --max-time 30 -w '\nHTTP_CODE:%{http_code}' -X POST "$BASE/gradio_api/call/v2/answer" -H 'Content-Type: application/json' -d '{"in_0":"Reply exactly OK","in_1":"You are concise.","in_2":false,"in_3":"low","in_4":0.7,"in_5":64,"in_6":null,"in_7":null}')
          echo "$SUBMIT"
          BODY=$(printf '%s' "$SUBMIT" | sed '/^HTTP_CODE:/d')
          CODE=$(printf '%s' "$SUBMIT" | sed -n 's/^HTTP_CODE://p')
          if [ "$CODE" != '200' ]; then
            echo "NO_KEY_SUBMIT_HTTP=$CODE"
            exit 2
          fi
          EVENT_ID=$(printf '%s' "$BODY" | jq -r '.event_id // empty')
          test -n "$EVENT_ID"
          RESULT=$(curl -sS -N --max-time 150 -w '\nHTTP_CODE:%{http_code}' "$BASE/gradio_api/call/answer/$EVENT_ID")
          echo "$RESULT"
          RESULT_CODE=$(printf '%s' "$RESULT" | sed -n 's/^HTTP_CODE://p')
          [ "$RESULT_CODE" = '200' ]
          printf '%s' "$RESULT" | grep -q 'OK'
